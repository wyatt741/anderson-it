name = "anderson-chat"
main = "worker.js"
compatibility_date = "2026-01-01"

# Serve the bot on our own domain, not the workers.dev subdomain.
workers_dev = false
routes = [
  { pattern = "chat.andersontechsupport.com", custom_domain = true }
]

# The Anthropic API key is NOT stored here. Set it as a secret:
#   wrangler secret put ANTHROPIC_API_KEY
#
# Per-IP rate limiting (25 req / 60s): activated 2026-07-24 for API cost-abuse defense.
# Native binding — consistent + burst-safe (KV was not, so it was replaced). worker.js gates on env.RL.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 25, period = 60 }
